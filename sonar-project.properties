# SonarQube project configuration file
sonar.projectKey=loraine19_P9-CICD
sonar.organization=loraine19
sonar.projectName=MicroCRM - Orion (Option B)

# Monorepo: back and front analysed together
sonar.sources=back/src/main/java,front/src
sonar.tests=back/src/test/java

# Back-end Java - Sonar analyses bytecode / analyse classes / report coverage from JaCoCo
sonar.java.source=17
sonar.java.binaries=back/build/classes/java/main
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml

# Front-end JavaScript/TypeScript - Sonar analyses source code / report coverage from Karma
sonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info
sonar.typescript.tsconfigPaths=front/tsconfig.json

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.angular/**,**/coverage/**,back/gradle/**,**/*.spec.ts
sonar.coverage.exclusions=**/*.spec.ts,**/main.ts,**/*Application.java,**/InitialDataFixture.java

sonar.sourceEncoding=UTF-8
