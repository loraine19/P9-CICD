# dependabot opens a PR for each update, ci.yml checks it before we merge
version: 2
updates:
    # back (gradle)
    - package-ecosystem: gradle
      directory: /back
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      commit-message:
          prefix: "chore(deps)" # chore = no release from semantic-release

    # front (npm)
    - package-ecosystem: npm
      directory: /front
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      commit-message:
          prefix: "chore(deps)"
      ignore:
          # major upgrades (Angular...) are done by hand
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]

    # actions used in the workflows
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "ci"

    # base images in the Dockerfile
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
