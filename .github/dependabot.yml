# dependabot opens a PR for each update, ci.yml checks it before we merge
# one grouped PR per ecosystem per week, majors are done by hand
version: 2
updates:
    # back (gradle)
    - package-ecosystem: gradle
      directory: /back
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)" # chore = no release from semantic-release
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"] # Spring Boot 4, Gradle 9...
      groups:
          gradle-minor-patch:
              update-types: ["minor", "patch"]

    # front (npm)
    - package-ecosystem: npm
      directory: /front
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"] # Angular majors
          - dependency-name: "zone.js"
            update-types: ["version-update:semver-minor"] # 0.x: minor = breaking, tied to Angular
      groups:
          npm-minor-patch: # Angular packages move together
              update-types: ["minor", "patch"]

    # actions used in the workflows
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "ci"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"]
      groups:
          actions-minor-patch:
              update-types: ["minor", "patch"]

    # base images in the Dockerfile
    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "chore(deps)"
      ignore:
          - dependency-name: "*"
            update-types: ["version-update:semver-major"] # Java 17 -> 25, Node 22 -> 26
