name: Release (CD)

# starts when CI has finished on main, and only releases if CI is green
on:
    workflow_run:
        workflows: ["CI"] # same name as in ci.yml
        types: [completed]
        branches: [main]

permissions:
    contents: write # tags + release + changelog commit
    packages: write # push images to ghcr
    issues: write
    pull-requests: write

env:
    JAVA_VERSION: "17"
    NODE_VERSION: "22"
    REGISTRY: ghcr.io

jobs:
    release:
        name: Semantic release
        runs-on: ubuntu-latest
        # only after a green CI on a push, not on PRs or failed runs
        if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
        outputs:
            published: ${{ steps.semantic.outputs.new_release_published }}
            version: ${{ steps.semantic.outputs.new_release_version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }} # the commit CI tested
                  fetch-depth: 0 # semantic-release needs all the tags

            # just build here, tests already ran in ci.yml
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
            - uses: gradle/actions/setup-gradle@v4
            - name: Back-end build (no tests)
              working-directory: back
              run: ./gradlew --no-daemon bootJar

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: front/package-lock.json
            - name: Front-end build (no tests)
              working-directory: front
              run: |
                  npm ci
                  npm run build -- --configuration production

            - name: Collect artifacts
              run: |
                  mkdir -p artifacts
                  cp back/build/libs/*.jar artifacts/microcrm-back.jar
                  (cd front/dist/microcrm/browser && zip -r ../../../../artifacts/microcrm-front.zip .)
                  (cd artifacts && sha256sum * > SHA256SUMS.txt)

            - name: Semantic release
              id: semantic
              uses: cycjimmy/semantic-release-action@v4
              with:
                  extra_plugins: |
                      @semantic-release/changelog
                      @semantic-release/git
                      conventional-changelog-conventionalcommits@8
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # only if semantic-release actually created a version
    images:
        name: Publish Docker images
        runs-on: ubuntu-latest
        needs: release
        if: needs.release.outputs.published == 'true'
        strategy:
            matrix:
                component: [back, front]
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }} # same commit as above

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # ghcr needs lowercase names, the action takes care of it
            - name: Compute tags and labels
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
                  tags: |
                      type=raw,value=${{ needs.release.outputs.version }}
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: ${{ matrix.component }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
