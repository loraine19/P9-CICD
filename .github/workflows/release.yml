name: Release (CD)

# Semantic versioning driven by Conventional Commits.
# Pushing to main runs semantic-release, which computes the next version
# from commit messages, then creates the tag, release, changelog and images.
on:
    push:
        branches: [main]

permissions:
    contents: write # tags, release, changelog commit
    packages: write # push images to GHCR
    issues: write # semantic-release notifications
    pull-requests: write

env:
    JAVA_VERSION: "17"
    NODE_VERSION: "22"
    REGISTRY: ghcr.io

jobs:
    release:
        name: Semantic release
        runs-on: ubuntu-latest
        outputs:
            published: ${{ steps.semantic.outputs.new_release_published }}
            version: ${{ steps.semantic.outputs.new_release_version }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # full history so semantic-release sees all tags

            # --- Re-run tests: never release an untested commit ---
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}
            - uses: gradle/actions/setup-gradle@v4
            - name: Back-end build and tests
              working-directory: back
              run: ./gradlew --no-daemon build

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: front/package-lock.json
            - name: Front-end tests and build
              working-directory: front
              run: |
                  npm ci
                  npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox
                  npm run build -- --configuration production

            # --- Collect artifacts for the release ---
            - name: Collect artifacts
              run: |
                  mkdir -p artifacts
                  cp back/build/libs/*.jar artifacts/microcrm-back.jar
                  (cd front/dist/microcrm/browser && zip -r ../../../../artifacts/microcrm-front.zip .)
                  (cd artifacts && sha256sum * > SHA256SUMS.txt)

            # --- semantic-release: version + tag + release + changelog ---
            - name: Semantic release
              id: semantic
              uses: cycjimmy/semantic-release-action@v4
              with:
                  extra_plugins: |
                      @semantic-release/changelog
                      @semantic-release/git
                      conventional-changelog-conventionalcommits
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Publish images only if a new version was actually released
    images:
        name: Publish Docker images
        runs-on: ubuntu-latest
        needs: release
        if: needs.release.outputs.published == 'true'
        strategy:
            matrix:
                component: [back, front]
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # metadata-action lowercases the image name (GHCR requires lowercase)
            - name: Compute tags and labels
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
                  tags: |
                      type=raw,value=${{ needs.release.outputs.version }}
                      type=raw,value=latest

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: ${{ matrix.component }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
