name: Nightly
# runs every night to catch problems from base images / runners, not from our code
on:
    schedule:
        - cron: "0 3 * * *"
    workflow_dispatch:

concurrency:
    group: nightly
    cancel-in-progress: true

permissions:
    contents: read

env:
    JAVA_VERSION: "17"
    NODE_VERSION: "22"

jobs:
    back:
        name: Back-end tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}

            - uses: gradle/actions/setup-gradle@v4

            - name: Build and test
              working-directory: back
              run: ./gradlew --no-daemon build

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: nightly-back-test-reports
                  path: back/build/reports/tests/test
                  retention-days: 7

    front:
        name: Front-end tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: front/package-lock.json

            - name: Install dependencies
              working-directory: front
              run: npm ci

            - name: Unit tests
              working-directory: front
              run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

    compose:
        name: Build images and docker compose smoke test
        runs-on: ubuntu-latest
        needs: [back, front]
        steps:
            - uses: actions/checkout@v4

            # --wait blocks until the healthchecks are green
            - name: Start the stack
              run: docker compose up -d --build --wait --wait-timeout 180

            - name: Smoke test - API responds
              run: curl -fsS http://localhost:8080/persons > /dev/null

            - name: Smoke test - front is served
              run: curl -fsS http://localhost:8082 | grep -q "<app-root"

            # only useful when something broke
            - name: Logs on failure
              if: failure()
              run: docker compose logs

            - name: Stop the stack
              if: always()
              run: docker compose down
