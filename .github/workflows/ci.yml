name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    JAVA_VERSION: "17"
    NODE_VERSION: "22"

jobs:
    back:
        name: Back-end (Spring Boot / Gradle)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: ${{ env.JAVA_VERSION }}

            - uses: gradle/actions/setup-gradle@v4

            # jacoco report is needed by sonar later
            - name: Build, test and coverage
              working-directory: back
              run: ./gradlew --no-daemon build jacocoTestReport

            - name: Upload test reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: back-test-reports
                  path: |
                      back/build/reports/tests/test
                      back/build/reports/jacoco/test
                  retention-days: 7

            - name: Upload JAR
              uses: actions/upload-artifact@v4
              with:
                  name: back-jar
                  path: back/build/libs/*.jar
                  retention-days: 7

            # sonar job needs the compiled classes, not just the jar
            - name: Upload analysis data
              uses: actions/upload-artifact@v4
              with:
                  name: back-analysis
                  path: |
                      back/build/classes/java/main
                      back/build/reports/jacoco/test/jacocoTestReport.xml
                  retention-days: 1

    front:
        name: Front-end (Angular / npm)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: npm
                  cache-dependency-path: front/package-lock.json

            - name: Install dependencies
              working-directory: front
              run: npm ci

            # Chrome is already on the runner, no need to install it
            - name: Unit tests and coverage
              working-directory: front
              run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

            - name: Production build
              working-directory: front
              run: npm run build -- --configuration production

            - name: Upload coverage report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: front-coverage
                  path: front/coverage
                  retention-days: 7

            - name: Upload Angular bundle
              uses: actions/upload-artifact@v4
              with:
                  name: front-dist
                  path: front/dist/microcrm
                  retention-days: 7

    sonar:
        name: SonarQube Cloud analysis
        runs-on: ubuntu-latest
        needs: [back, front]
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download back analysis data
              uses: actions/download-artifact@v7
              with:
                  name: back-analysis
                  path: back/build

            - name: Download front coverage
              uses: actions/download-artifact@v7
              with:
                  name: front-coverage
                  path: front/coverage

            # secrets are not available on forks, hence the if on the job
            - name: Sonar scan
              uses: SonarSource/sonarqube-scan-action@v5
              env:
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    docker:
        name: Build images and smoke test
        runs-on: ubuntu-latest
        needs: [back, front]
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Build back-end image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: back
                  tags: microcrm-back:ci
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Build front-end image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: front
                  tags: microcrm-front:ci
                  load: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # just building is not enough, make sure the containers really start
            - name: Smoke test - API responds
              run: |
                  docker run -d --name back -p 8080:8080 microcrm-back:ci
                  for i in $(seq 1 30); do
                    if curl -fsS http://localhost:8080/persons > /dev/null; then
                      echo "API up"; exit 0
                    fi
                    sleep 2
                  done
                  echo "API failed to start"; docker logs back; exit 1

            - name: Smoke test - front is served
              run: |
                  docker run -d --name front -p 8081:80 microcrm-front:ci
                  for i in $(seq 1 15); do
                    if curl -fsS http://localhost:8081 | grep -q "<app-root"; then
                      echo "Front served"; exit 0
                    fi
                    sleep 2
                  done
                  echo "Front not served"; docker logs front; exit 1

            - name: Stop containers
              if: always()
              run: docker rm -f back front || true
